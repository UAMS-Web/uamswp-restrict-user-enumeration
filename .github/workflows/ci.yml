name: CI

# The checks this plugin runs on every pull request and on pushes to main.
#
# The lint, static-analysis and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`,
# called by the `checks` job, so this repository carries no copy of it that drifts. The call
# runs on Linux only, leaves mutation testing off (until UAMS-Web/uamswp-restrict-user-enumeration#28),
# parses the plugin file under its declared floor, and runs the Pest Unit suite as
# `composer test:unit`. The PHPUnit Integration and kill-switch suites need MySQL and a WordPress
# core, so they run locally, not in this workflow. `phpcs` stays off: the Composer script
# `lint` runs it and the chain's own copy needs a script this repository does not define.
# `download-archive` stays off until the keep-list in `.gitattributes` exists
# (UAMS-Web/uamswp-restrict-user-enumeration#18).
#
# The `guard` job is the one check the chain does not cover: it refuses a tracked file that
# could hold a secret or personal data. It runs beside the call and is listed in the `needs:` of `CI`.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the
# call and `guard`, runs `if: always()`, and fails unless each reports `success`: a `skipped`
# or `cancelled` result fails it. Adding a plain job here means adding it to the `needs:`
# list of `CI`. Do not rename `CI`, and do not rename `checks` without changing `needs:` below.
#
# What this repository carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, and the Composer
# scripts `test:pint`, `test:refactor`, `stan` and `test:unit`. `composer.json` pins
# `config.platform.php` to the PHP the development tools need, which is what the chain installs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    # Pinned to a release tag, never a branch or a commit, so a change to the chain reaches this
    # plugin only when the pin moves.
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.11.0
    with:
      linux-only: true
      mutate: false
      global-test-symbols: false
      pest-command: composer test:unit
      floor-lint: true
      floor-lint-php: '7.1'
      floor-lint-command: php -l uamswp-restrict-user-enumeration.php

  # Refuses a tracked file that could hold a secret or personal data. The same list is in
  # `.githooks/pre-commit`; keep the two in step.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard against committed secrets and personal data
        run: |
          bad=$(git ls-files | grep -E 'sentinel-key\.php$|wp-config\.php$|\.sql(\.gz)?$|\.(csv|tsv|xlsx?)$|\.env(\.|$)|\.pem$|\.key$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked secret or personal-data file(s) detected:"; echo "$bad"; exit 1
          fi

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call and every plain job.
  ci:
    name: CI
    needs: [checks, guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
